global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # NiFi 2.x metrics endpoint (HTTPS + client certificate CN=prometheus, read-only /flow policy).
  # Only the NiFi mode that is running will be "up"; the other one shows as down.
  - job_name: 'nifi'
    scheme: https
    metrics_path: /nifi-api/flow/metrics/prometheus
    tls_config:
      ca_file: /etc/prometheus/certs/ca.crt
      cert_file: /etc/prometheus/certs/prometheus.crt
      key_file: /etc/prometheus/certs/prometheus.key
    static_configs:
      - targets: ['nifi:8443']
        labels:
          mode: single
      - targets: ['nifi1:8443', 'nifi2:8443', 'nifi3:8443']
        labels:
          mode: cluster

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
