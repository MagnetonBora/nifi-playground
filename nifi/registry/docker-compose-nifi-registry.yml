# NiFi Registry 2.12.0 + LDAP (lldap), shared by the single-node and the cluster NiFi via "nifi-net"
#
#   make registry
#
# Secured (HTTPS, certificates from the shared CA in nifi/certs):
#   UI: https://localhost:18443/nifi-registry   login admin / ctsBtRBKHRAx69EqUghvvgEvjnaLjFEB (LDAP)
#   Users (LDAP): http://localhost:17170 (lldap web UI, same admin login); add a user there, then
#       grant bucket policies to the same username in the Registry UI
#   Registry Client URL in NiFi (NifiRegistryFlowRegistryClient): https://nifi-registry:18443
#       (created by make policies-nifi / policies-cluster; no SSL Context Service needed). NiFi
#       authenticates with its node certificate and proxies the logged-in NiFi user, so versions
#       are committed as "admin".
#   Policies: authorizers.xml

x-cert-pass: &cert-pass "changeMeCertPassword"
x-admin-pass: &admin-pass ctsBtRBKHRAx69EqUghvvgEvjnaLjFEB
x-ldap-base: &ldap-base "dc=nifi,dc=playground"

services:
  # One-shot job: shared CA + registry keystore in nifi/certs (idempotent, same job as in the NiFi compose files)
  registry-certs:
    image: apache/nifi:2.12.0
    container_name: nifi-registry-certs-init
    labels:
      playground.role: init   # removed after start by `make` (clean-init)
    user: root
    entrypoint: ["sh", "/nifi-common/generate-certs.sh"]
    environment:
      CERT_PASSWORD: *cert-pass
    volumes:
      - ../common:/nifi-common:ro
      - ../certs:/certs

  # One-shot job: data dirs don't exist in the registry image, so Docker creates
  # the volumes owned by root; hand them over to the nifi user (uid 1000)
  registry-init:
    image: apache/nifi-registry:2.12.0
    container_name: nifi-registry-init
    labels:
      playground.role: init   # removed after start by `make` (clean-init)
    user: root
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /opt/nifi-registry/nifi-registry-current/database /opt/nifi-registry/nifi-registry-current/flow_storage /opt/nifi-registry/nifi-registry-current/logs"]
    volumes:
      - registry_database:/opt/nifi-registry/nifi-registry-current/database
      - registry_flow_storage:/opt/nifi-registry/nifi-registry-current/flow_storage
      - registry_logs:/opt/nifi-registry/nifi-registry-current/logs

  # Lightweight LDAP server with a web UI: user store for the Registry login.
  # Built-in user "admin" (uid=admin,ou=people,...) is created on the first start with the password below.
  registry-ldap:
    image: lldap/lldap:stable
    container_name: nifi-registry-ldap
    hostname: registry-ldap
    restart: unless-stopped
    ports:
      - "17170:17170"   # web UI
    environment:
      LLDAP_LDAP_BASE_DN: *ldap-base
      LLDAP_LDAP_USER_PASS: *admin-pass
      LLDAP_JWT_SECRET: "changeMeLldapJwtSecret"
      LLDAP_KEY_SEED: "changeMeLldapKeySeed"
    volumes:
      - registry_ldap:/data
    networks:
      - nifi-net

  nifi-registry:
    image: apache/nifi-registry:2.12.0
    container_name: nifi-registry
    hostname: nifi-registry
    restart: unless-stopped
    depends_on:
      registry-certs:
        condition: service_completed_successfully
      registry-init:
        condition: service_completed_successfully
      registry-ldap:
        condition: service_started
    ports:
      - "18443:18443"
    # conf is not a volume: the stock start script rebuilds it from the variables below on every start.
    # authorizers.xml is copied (not bind-mounted) because the start script edits it in place.
    entrypoint:
      - sh
      - -c
      - |
        cp /registry-conf/authorizers.xml /opt/nifi-registry/nifi-registry-current/conf/authorizers.xml
        exec /opt/nifi-registry/scripts/start.sh
    environment:
      # HTTPS with the keystore from nifi/certs; users log in via LDAP, NiFi nodes via client certificate
      AUTH: ldap
      NIFI_REGISTRY_WEB_HTTPS_PORT: "18443"
      KEYSTORE_PATH: /certs/nifi-registry.p12
      KEYSTORE_TYPE: PKCS12
      KEYSTORE_PASSWORD: *cert-pass
      TRUSTSTORE_PATH: /certs/truststore.p12
      TRUSTSTORE_TYPE: PKCS12
      TRUSTSTORE_PASSWORD: *cert-pass
      INITIAL_ADMIN_IDENTITY: admin   # same as in authorizers.xml (the start script writes it there)
      LDAP_URL: ldap://registry-ldap:3890
      LDAP_AUTHENTICATION_STRATEGY: SIMPLE
      LDAP_MANAGER_DN: "uid=admin,ou=people,dc=nifi,dc=playground"
      LDAP_MANAGER_PASSWORD: *admin-pass
      LDAP_USER_SEARCH_BASE: "ou=people,dc=nifi,dc=playground"
      LDAP_USER_SEARCH_FILTER: "(uid={0})"
      LDAP_IDENTITY_STRATEGY: USE_USERNAME
    volumes:
      - ./authorizers.xml:/registry-conf/authorizers.xml:ro
      - ../certs:/certs:ro
      - registry_database:/opt/nifi-registry/nifi-registry-current/database
      - registry_flow_storage:/opt/nifi-registry/nifi-registry-current/flow_storage
      - registry_logs:/opt/nifi-registry/nifi-registry-current/logs
    networks:
      - nifi-net
    healthcheck:
      test: ["CMD-SHELL", "curl -kfs https://$$(hostname):18443/nifi-registry/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  registry_database:
  registry_flow_storage:
  registry_logs:
  registry_ldap:

networks:
  nifi-net:
    external: true
