# HEC over plain HTTP (like splunk-sim), inside nifi-net:
#   http://splunk:8088/services/collector/raw    NDJSON as sent by the labs (one event per line)
#   http://splunk:8088/services/collector/event  HEC JSON envelope {"event": ...}
#   header  Authorization: Splunk 00000000-0000-0000-0000-000000000000   (same demo token as Lab 6)
[http]
disabled = 0
enableSSL = 0
port = 8088

[http://nifi]
disabled = 0
token = 00000000-0000-0000-0000-000000000000
index = nifi
indexes = nifi,main
sourcetype = nifi:json
useACK = 0

# TCP input like splunk-sim: newline-delimited events (PutSplunk, Message Delimiter \n)
[tcp://5514]
disabled = 0
index = nifi
sourcetype = nifi:json
connection_host = dns
