# One JSON object per line; fields are extracted at search time.
# Timestamp = time of arrival (the lab generators produce random values).
[nifi:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
KV_MODE = json
DATETIME_CONFIG = CURRENT
category = Structured
description = NDJSON events delivered by NiFi
